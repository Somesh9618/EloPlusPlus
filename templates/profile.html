{% extends "base.html" %}

{% block title %}Elo++ | Profile - Somesh9618{% endblock %}

{% block content %}
<section class="profile-section" style="display: flex; justify-content: center; margin-top: 2rem;">
    <div class="profile-header glass-panel" style="max-width: 480px; width: 100%; display: flex; flex-direction: column; align-items: center; text-align: center; padding: 3rem 2rem; gap: 1.5rem;">
        <div class="profile-avatar-wrapper" style="width: 120px; height: 120px; border-radius: 50%; background: rgba(0, 242, 254, 0.1); border: 2px solid var(--secondary-glow); display: flex; align-items: center; justify-content: center; color: var(--secondary-glow); filter: drop-shadow(0 0 15px rgba(0, 242, 254, 0.3));">
            <!-- Elegant Chess Queen SVG instead of anime character -->
            <svg class="profile-avatar-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width: 60px; height: 60px;">
                <path d="M12 2L9 7L4 5L7 11H17L20 5L15 7L12 2Z" fill="currentColor" fill-opacity="0.2" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
                <path d="M7 11V16H17V11H7Z" fill="currentColor" fill-opacity="0.2" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
                <path d="M5 20H19C19 18 17 18 17 16H7C7 18 5 18 5 20Z" fill="currentColor" fill-opacity="0.2" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
                <circle cx="12" cy="2" r="1" fill="currentColor"/>
                <circle cx="4" cy="5" r="1" fill="currentColor"/>
                <circle cx="20" cy="5" r="1" fill="currentColor"/>
            </svg>
        </div>
        <div class="profile-info" style="display: flex; flex-direction: column; gap: 0.5rem; width: 100%;">
            <h1 class="player-name" style="font-size: 2.2rem; font-weight: 700; color: #FFFFFF; letter-spacing: -0.5px;">
                {% if connected_chess_username %}
                    {{ connected_chess_username }}
                {% else %}
                    Somesh9618
                {% endif %}
            </h1>
            <p style="color: var(--text-muted); font-size: 0.95rem;">Chess Player Profile</p>
        </div>
    </div>
</section>
{% endblock %}
